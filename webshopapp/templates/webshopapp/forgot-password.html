{% extends "webshopapp/base.html" %}
 
{% block title %}パスワード再登録{% endblock %}
 
{% block content %}

    <main>
        <div class="login-form-container">
            <h1>パスワードの再設定</h1>
            <p style="text-align: center; margin-top: -15px; margin-bottom: 30px; font-size: 0.9em; color: #6c757d;">
                ご登録のメールアドレスと生年月日を入力してください。
            </p>
            <form>
                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="birthday">生年月日</label>
                    <input type="date" id="birthday" name="birthday" required>
                </div>
                <button type="submit" class="login-btn">再設定メールを送信</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
{% endblock %}
