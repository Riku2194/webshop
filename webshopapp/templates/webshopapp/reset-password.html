{% extends "webshopapp/base.html" %}
 
{% block title %}パスワードリセット{% endblock %}
 
{% block content %}

    <main>
        <div class="login-form-container">
            <h1>新しいパスワードの設定</h1>
            <p style="text-align: center; margin-top: -15px; margin-bottom: 30px; font-size: 0.9em; color: #6c757d;">
                新しいパスワードを入力してください。
            </p>
            <form>
                <div class="form-group">
                    <label for="password">新しいパスワード</label>
                    <input type="password" id="password" name="password" placeholder="8文字以上で入力" required>
                </div>
                <div class="form-group">
                    <label for="password-confirm">新しいパスワード（確認用）</label>
                    <input type="password" id="password-confirm" name="password_confirm" placeholder="もう一度パスワードを入力" required>
                </div>
                <button type="submit" class="login-btn">パスワードを更新する</button>
            </form>
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
{% endblock %}
