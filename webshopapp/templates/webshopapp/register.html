{% extends "webshopapp/base.html" %}
 
{% block title %}本登録{% endblock %}
 
{% block content %}

    <main>
        <div class="login-form-container">
            <h1>本登録</h1>
            <p style="text-align: center; margin-top: -15px; margin-bottom: 30px; font-size: 0.9em; color: #6c757d;">
                パスワードと誕生日を設定してください。
            </p>
            <form>
                <div class="form-group">
                    <label for="password">パスワード</label>
                    <input type="password" id="password" name="password" placeholder="8文字以上で入力" required>
                </div>
                <div class="form-group">
                    <label for="password-confirm">パスワード（確認用）</label>
                    <input type="password" id="password-confirm" name="password_confirm" placeholder="もう一度パスワードを入力" required>
                </div>
                <div class="form-group">
                    <label for="birthday">生年月日</label>
                    <input type="date" id="birthday" name="birthday" required>
                </div>
                <button type="submit" class="login-btn">登録を完了する</button>
            </form>
        </div>
    </main>


    <script src="script.js"></script>
</body>
</html>
{% endblock %}
